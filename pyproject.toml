[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wireless-rtc"
version = "0.1.0"
description = "Causal delay prediction and reproducible RTC experiments"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
wireless-rtc = "wireless_rtc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
