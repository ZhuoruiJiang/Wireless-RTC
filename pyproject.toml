[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wireless-rtc"
version = "0.1.0"
description = "Causal delay prediction and reproducible RTC experiments"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
prediction = ["scikit-learn>=1.5,<2"]

[project.scripts]
wireless-rtc = "wireless_rtc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wireless_rtc = ["simulation/web/*.html", "simulation/web/*.css", "simulation/web/*.js"]

[tool.uv]
# OneDrive-backed Windows checkouts cannot reliably use cache hardlinks.
link-mode = "copy"
